<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservar turno — Clavis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: var(--bg); }
    .reservar-wrap { max-width: 460px; margin: 40px auto; padding: 0 16px 60px; }
    .reservar-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 26px; box-shadow: var(--shadow); }
    .reservar-card h1 { font-size: 22px; margin: 0 0 4px; font-weight: 800; }
    .reservar-card form { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
    .reservar-card label { font-size: 13px; font-weight: 600; margin-bottom: 4px; display: block; }
    .huecos-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .hueco-btn { border: 1px solid var(--border); background: var(--panel-2); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; font-weight: 700; cursor: pointer; color: var(--text); }
    .hueco-btn:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }
    .brand-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; margin-bottom: 18px; }
    /* Tira de días — elemento principal para elegir fecha, bien
       visible, para que "probar otro día" sea obvio antes de
       ofrecer la lista de espera como alternativa menor. */
    .dias-strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin-top: 6px; -webkit-overflow-scrolling: touch; }
    .dia-pill {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 64px;
      padding: 10px 8px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }
    .dia-pill-nombre { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--text-muted); }
    .dia-pill-num { font-size: 15px; }
    .dia-pill:hover { border-color: var(--accent); opacity: 1; }
    .dia-pill.active { background: var(--accent); border-color: var(--accent); }
    .dia-pill.active .dia-pill-nombre, .dia-pill.active .dia-pill-num { color: #fff; }
    /* Lista de espera: a propósito más chica/discreta que la tira de
       días de arriba — es el plan B, no lo primero que se ve. */
    .espera-cta { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .espera-cta form { gap: 8px; margin-top: 0; }
    .espera-cta input { padding: 8px 10px; font-size: 13px; }
    .espera-cta button { font-size: 12.5px; padding: 7px 14px; }
    /* Honeypot anti-bot (ver reservar.js): invisible y no-tabeable para
       una persona real, pero sigue en el flujo del documento — a
       diferencia de display:none, que algunos bots de formularios ya
       saben esquivar. */
    .hp-field { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <div class="reservar-wrap">
    <div class="brand-logo" id="reservar-brand"><span class="brand-mark"></span>Clavis</div>
    <div id="reservar-app" class="reservar-card">Cargando...</div>
    <p class="hint" style="text-align:center;margin-top:18px;">Reservas con Clavis</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="reservar.js"></script>
</body>
</html>
